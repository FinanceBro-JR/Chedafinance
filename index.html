const generateSampleData = () => {
  const now = new Date();
  const data = [];
  let id = 1;
  for (let m = 5; m >= 0; m--) {
    const month = new Date(now.getFullYear(), now.getMonth() - m, 1);
    const y = month.getFullYear(),
      mo = month.getMonth();
    data.push({
      id: id++,
      type: "income",
      amount: 16500000,
      category: "Salary",
      description: "Monthly salary",
      date: new Date(y, mo, 1).toISOString().split("T")[0]
    });
    if (Math.random() > 0.4) data.push({
      id: id++,
      type: "income",
      amount: Math.round((800000 + Math.random() * 1200000) / 1000) * 1000,
      category: "Freelance",
      description: "Freelance project",
      date: new Date(y, mo, 10 + Math.floor(Math.random() * 10)).toISOString().split("T")[0]
    });
    [{
      amount: 4500000,
      category: "Housing",
      description: "Rent"
    }, {
      amount: Math.round((600000 + Math.random() * 400000) / 1000) * 1000,
      category: "Food",
      description: "Groceries & dining"
    }, {
      amount: Math.round((150000 + Math.random() * 200000) / 1000) * 1000,
      category: "Transport",
      description: "Fuel & transit"
    }, {
      amount: Math.round((80000 + Math.random() * 120000) / 1000) * 1000,
      category: "Entertainment",
      description: "Events & streaming"
    }, {
      amount: Math.round((120000 + Math.random() * 80000) / 1000) * 1000,
      category: "Utilities",
      description: "Electric & internet"
    }].forEach(e => data.push({
      id: id++,
      type: "expense",
      ...e,
      date: new Date(y, mo, Math.floor(Math.random() * 28) + 1).toISOString().split("T")[0]
    }));
    if (Math.random() > 0.5) data.push({
      id: id++,
      type: "expense",
      amount: Math.round((100000 + Math.random() * 300000) / 1000) * 1000,
      category: "Shopping",
      description: "Online shopping",
      date: new Date(y, mo, Math.floor(Math.random() * 28) + 1).toISOString().split("T")[0]
    });
  }
  return data.sort((a, b) => new Date(b.date) - new Date(a.date));
};
